# Example: run Substack automations on a schedule with GitHub Actions.
# 1. Add COTLET_API_KEY under Settings > Secrets and variables > Actions.
# 2. Uncomment `schedule`. Reading stats and comments needs no confirmation.
name: Substack weekly

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 8 * * 1"

jobs:
  substack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Weekly subscriber and revenue report
        env:
          COTLET_API_KEY: ${{ secrets.COTLET_API_KEY }}
        run: python weekly_report.py
      - name: Comments waiting for a reply
        env:
          COTLET_API_KEY: ${{ secrets.COTLET_API_KEY }}
        run: python unanswered_comments.py --days 7
